<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Spotify Butler 90s low-resolution computer-game client</title>
  <desc id="desc">A navy-and-gold playlist generator interface rendered as modern vector graphics with blocky pixel-game geometry, a left playlist list, and an editable selected playlist on the right.</desc>
  <defs>
    <pattern id="starfield" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#051E39"/>
      <rect x="8" y="12" width="4" height="4" fill="#0D2A47"/>
      <rect x="44" y="20" width="4" height="4" fill="#0A2949"/>
      <rect x="28" y="48" width="4" height="4" fill="#183A58"/>
      <rect x="52" y="56" width="4" height="4" fill="#8F713D"/>
      <rect x="53" y="57" width="2" height="2" fill="#DEBD88"/>
    </pattern>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#071F38"/>
      <rect width="8" height="2" fill="#0A2949"/>
      <rect y="4" width="4" height="2" fill="#0D2A47"/>
    </pattern>
    <linearGradient id="goldScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DEBD88"/>
      <stop offset="0.5" stop-color="#B39051"/>
      <stop offset="1" stop-color="#604C2A"/>
    </linearGradient>
    <style>
      .pixel { font-family: "Courier New", "SFMono-Regular", Consolas, monospace; font-weight: 700; letter-spacing: 1px; }
      .pixel-heavy { font-family: "Courier New", "SFMono-Regular", Consolas, monospace; font-weight: 900; letter-spacing: 2px; }
      .white { fill: #F5F5F5; }
      .gold { fill: #DEBD88; }
      .gold-dark { fill: #8F713D; }
      .muted { fill: #A7A7A7; }
      .faint { fill: #7891A4; }
      .navy { fill: #051E39; }
      .panel { fill: #071F38; stroke: #3F789E; stroke-width: 4; shape-rendering: crispEdges; }
      .inner-line { fill: none; stroke: #183A58; stroke-width: 2; shape-rendering: crispEdges; }
      .marker { fill: #8F713D; stroke: #DEBD88; stroke-width: 3; shape-rendering: crispEdges; }
      .marker-text { fill: #F9F6E5; font-family: "Courier New", monospace; font-size: 17px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1440" height="920" fill="#051E39"/>
  <rect width="1440" height="920" fill="url(#starfield)" opacity="0.7"/>

  <!-- outer computer-game frame -->
  <path d="M24 24H1416V896H24Z" fill="#03182E" stroke="#DEBD88" stroke-width="4" shape-rendering="crispEdges"/>
  <path d="M32 32H1408V888H32Z" fill="none" stroke="#34546C" stroke-width="4" shape-rendering="crispEdges"/>
  <path d="M32 32H1408V96H32Z" fill="#0E2D4D" shape-rendering="crispEdges"/>
  <path d="M32 92H1408M32 96H1408" stroke="#8F713D" stroke-width="2" shape-rendering="crispEdges"/>

  <!-- simple browser-style app header -->
  <text x="56" y="70" class="pixel-heavy gold" font-size="19">BUTLER // PLAYLIST STUDIO</text>
  <text x="1214" y="70" class="pixel white" font-size="17">LIBRARY READY</text>

  <!-- left playlist selector -->
  <g aria-hidden="true">
    <rect x="408" y="150" width="8" height="684" fill="#001326" shape-rendering="crispEdges"/>
    <rect x="56" y="834" width="360" height="8" fill="#001326" shape-rendering="crispEdges"/>
    <rect x="64" y="842" width="352" height="6" fill="#03182E" shape-rendering="crispEdges"/>
  </g>
  <rect x="48" y="142" width="360" height="692" class="panel"/>
  <polygon points="60,112 328,112 312,142 48,142" fill="#0E2D4D" stroke="#3F789E" stroke-width="3" shape-rendering="crispEdges"/>
  <path d="M64 118H318L308 136H56Z" fill="#183A58" shape-rendering="crispEdges"/>
  <text x="66" y="136" class="pixel-heavy white" font-size="17">AVAILABLE PLAYLISTS</text>
  <rect x="374" y="155" width="22" height="22" class="marker"/>
  <text x="385" y="167" class="marker-text" font-size="14">a</text>
  <text x="66" y="199" class="pixel gold" font-size="15">SELECT A RECIPE TO PREVIEW</text>
  <text x="66" y="216" class="pixel faint" font-size="13">[UP/DOWN] MOVE   [ENTER] OPEN</text>

  <!-- selected playlist row -->
  <rect x="62" y="232" width="332" height="78" fill="#3D3220" stroke="#8F713D" stroke-width="4" shape-rendering="crispEdges"/>
  <rect x="76" y="246" width="50" height="50" fill="url(#goldScreen)" shape-rendering="crispEdges"/>
  <rect x="86" y="256" width="8" height="28" fill="#051E39"/>
  <rect x="98" y="248" width="8" height="40" fill="#051E39"/>
  <rect x="110" y="264" width="8" height="20" fill="#051E39"/>
  <rect x="142" y="258" width="10" height="10" fill="#DEBD88"/>
  <text x="158" y="261" class="pixel-heavy white" font-size="19">DEEP FOCUS</text>
  <text x="158" y="286" class="pixel muted" font-size="14">45 TRACKS / BUILT-IN</text>
  <text x="369" y="278" class="pixel-heavy gold" font-size="25">&gt;</text>

  <!-- other playlist rows -->
  <rect x="62" y="318" width="332" height="78" fill="#0E2C4A" stroke="#183A58" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="76" y="332" width="50" height="50" fill="#183A58" shape-rendering="crispEdges"/>
  <rect x="84" y="340" width="34" height="8" fill="#8F713D"/>
  <rect x="92" y="348" width="18" height="26" fill="#8F713D"/>
  <text x="140" y="347" class="pixel-heavy white" font-size="16">WEEKEND ENERGY</text>
  <text x="140" y="372" class="pixel muted" font-size="14">60 TRACKS / BUILT-IN</text>

  <rect x="62" y="404" width="332" height="78" fill="#0E2C4A" stroke="#183A58" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="76" y="418" width="50" height="50" fill="#183A58" shape-rendering="crispEdges"/>
  <rect x="84" y="426" width="34" height="8" fill="#DEBD88"/>
  <rect x="84" y="442" width="12" height="8" fill="#8F713D"/>
  <rect x="104" y="442" width="14" height="8" fill="#8F713D"/>
  <rect x="84" y="458" width="34" height="8" fill="#DEBD88"/>
  <text x="140" y="433" class="pixel-heavy white" font-size="16">RECENTLY PLAYED</text>
  <text x="140" y="458" class="pixel muted" font-size="14">100 TRACKS / BUILT-IN</text>

  <rect x="62" y="490" width="332" height="78" fill="#0E2C4A" stroke="#183A58" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="76" y="504" width="50" height="50" fill="#183A58" shape-rendering="crispEdges"/>
  <rect x="84" y="512" width="34" height="8" fill="#8F713D"/>
  <rect x="92" y="520" width="18" height="8" fill="#DEBD88"/>
  <rect x="84" y="536" width="34" height="8" fill="#8F713D"/>
  <rect x="92" y="544" width="18" height="8" fill="#DEBD88"/>
  <text x="140" y="519" class="pixel-heavy white" font-size="16">NEW DISCOVERIES</text>
  <text x="140" y="544" class="pixel muted" font-size="14">32 TRACKS / BUILT-IN</text>

  <polygon points="72,590 394,590 384,637 62,637" fill="#0D2B48" stroke="#34546C" stroke-width="3" shape-rendering="crispEdges"/>
  <text x="76" y="620" class="pixel-heavy gold" font-size="16">+ NEW PLAYLIST RECIPE</text>
  <text x="66" y="687" class="pixel faint" font-size="13">CACHE STATUS: READY</text>
  <text x="66" y="708" class="pixel faint" font-size="13">LAST REFRESH: JUST NOW</text>
  <rect x="66" y="730" width="8" height="8" fill="#8F713D"/>
  <rect x="82" y="730" width="8" height="8" fill="#DEBD88"/>
  <rect x="98" y="730" width="8" height="8" fill="#8F713D"/>
  <text x="118" y="739" class="pixel faint" font-size="13">SYSTEM ONLINE</text>

  <!-- right mission header -->
  <g aria-hidden="true">
    <rect x="1392" y="150" width="8" height="168" fill="#001326" shape-rendering="crispEdges"/>
    <rect x="436" y="318" width="964" height="8" fill="#001326" shape-rendering="crispEdges"/>
    <rect x="444" y="326" width="956" height="6" fill="#03182E" shape-rendering="crispEdges"/>
  </g>
  <rect x="428" y="142" width="964" height="176" class="panel"/>
  <polygon points="440,112 846,112 830,142 428,142" fill="#0E2D4D" stroke="#3F789E" stroke-width="3" shape-rendering="crispEdges"/>
  <path d="M444 118H836L826 136H436Z" fill="#183A58" shape-rendering="crispEdges"/>
  <text x="448" y="136" class="pixel-heavy white" font-size="17">MISSION / PLAYLIST TO GENERATE</text>
  <rect x="1356" y="155" width="22" height="22" class="marker"/>
  <text x="1367" y="167" class="marker-text" font-size="14">b</text>

  <!-- blocky playlist cover -->
  <rect x="460" y="190" width="120" height="120" fill="#8F713D" stroke="#DEBD88" stroke-width="4" shape-rendering="crispEdges"/>
  <rect x="474" y="204" width="92" height="92" fill="#B39051" shape-rendering="crispEdges"/>
  <rect x="488" y="218" width="14" height="58" fill="#051E39"/>
  <rect x="510" y="204" width="14" height="88" fill="#051E39"/>
  <rect x="532" y="234" width="14" height="58" fill="#051E39"/>
  <rect x="554" y="218" width="7" height="74" fill="#051E39"/>
  <rect x="482" y="212" width="7" height="7" fill="#DEBD88"/>
  <rect x="524" y="226" width="7" height="7" fill="#DEBD88"/>
  <rect x="547" y="212" width="7" height="7" fill="#DEBD88"/>

  <text x="604" y="214" class="pixel gold" font-size="14">ACTIVE RECIPE // 01</text>
  <text x="604" y="251" class="pixel-heavy white" font-size="32">DEEP FOCUS</text>
  <text x="604" y="279" class="pixel muted" font-size="16">CONCENTRATION WITHOUT THE CLUTTER</text>
  <text x="604" y="302" class="pixel faint" font-size="14">45 TRACKS / BUILT-IN / SYNCED TO SPOTIFY</text>
  <polygon points="1190,274 1358,274 1352,298 1184,298" fill="#183A58" stroke="#34546C" stroke-width="2" shape-rendering="crispEdges"/>
  <text x="1271" y="291" class="pixel gold" font-size="12" text-anchor="middle">STATUS: MAPPED</text>

  <!-- editable playlist panel -->
  <g aria-hidden="true">
    <rect x="1392" y="392" width="8" height="442" fill="#001326" shape-rendering="crispEdges"/>
    <rect x="436" y="834" width="964" height="8" fill="#001326" shape-rendering="crispEdges"/>
    <rect x="444" y="842" width="956" height="6" fill="#03182E" shape-rendering="crispEdges"/>
  </g>
  <rect x="428" y="384" width="964" height="450" class="panel"/>
  <polygon points="440,354 752,354 736,384 428,384" fill="#0E2D4D" stroke="#3F789E" stroke-width="3" shape-rendering="crispEdges"/>
  <path d="M444 360H742L732 378H436Z" fill="#183A58" shape-rendering="crispEdges"/>
  <text x="448" y="378" class="pixel-heavy white" font-size="19">CURRENT SELECTION</text>
  <rect x="432" y="386" width="956" height="39" fill="url(#scanlines)" shape-rendering="crispEdges"/>
  <path d="M432 386H1388M432 425H1388" stroke="#8F713D" stroke-width="2" shape-rendering="crispEdges"/>
  <text x="448" y="419" class="pixel faint" font-size="12">EDIT MODE // DRAG TO REORDER // REMOVE WITH [X]</text>
  <rect x="1356" y="361" width="22" height="22" class="marker"/>
  <text x="1367" y="373" class="marker-text" font-size="14">c</text>

  <text x="448" y="443" class="pixel gold" font-size="13">NO.</text>
  <text x="496" y="443" class="pixel gold" font-size="13">TITLE / ARTIST</text>
  <text x="1018" y="443" class="pixel gold" font-size="13">ALBUM</text>
  <text x="1318" y="443" class="pixel gold" font-size="13">CMD</text>
  <path d="M448 455H1372" class="inner-line"/>

  <!-- track row one -->
  <text x="448" y="488" class="pixel white" font-size="17">01</text>
  <rect x="496" y="466" width="42" height="42" fill="#66563A" shape-rendering="crispEdges"/>
  <rect x="504" y="474" width="10" height="26" fill="#DEBD88"/>
  <rect x="520" y="482" width="10" height="18" fill="#051E39"/>
  <text x="562" y="482" class="pixel-heavy white" font-size="16">LIMINAL SPACE</text>
  <text x="562" y="500" class="pixel muted" font-size="12">HOLLOW COVES</text>
  <text x="1018" y="488" class="pixel muted" font-size="13">DRIFTWOOD</text>
  <text x="1318" y="488" class="pixel gold" font-size="18">[X]</text>
  <path d="M448 516H1372" class="inner-line"/>

  <!-- track row two -->
  <text x="448" y="549" class="pixel white" font-size="17">02</text>
  <rect x="496" y="527" width="42" height="42" fill="#183A58" shape-rendering="crispEdges"/>
  <rect x="504" y="535" width="26" height="10" fill="#8F713D"/>
  <rect x="512" y="545" width="10" height="18" fill="#DEBD88"/>
  <text x="562" y="543" class="pixel-heavy white" font-size="16">WEIGHTLESS</text>
  <text x="562" y="561" class="pixel muted" font-size="12">MARCONI UNION</text>
  <text x="1018" y="549" class="pixel muted" font-size="13">AMBIENT WORKS</text>
  <text x="1318" y="549" class="pixel gold" font-size="18">[X]</text>
  <path d="M448 577H1372" class="inner-line"/>

  <!-- track row three -->
  <text x="448" y="610" class="pixel white" font-size="17">03</text>
  <rect x="496" y="588" width="42" height="42" fill="#0E2C4A" stroke="#8F713D" stroke-width="2" shape-rendering="crispEdges"/>
  <rect x="504" y="596" width="26" height="8" fill="#DEBD88"/>
  <rect x="504" y="612" width="18" height="8" fill="#8F713D"/>
  <rect x="504" y="620" width="26" height="4" fill="#DEBD88"/>
  <text x="562" y="604" class="pixel-heavy white" font-size="16">A WALK</text>
  <text x="562" y="622" class="pixel muted" font-size="12">TYCHO</text>
  <text x="1018" y="610" class="pixel muted" font-size="13">AWAKE</text>
  <text x="1318" y="610" class="pixel gold" font-size="18">[X]</text>
  <path d="M448 638H1372" class="inner-line"/>

  <!-- track row four -->
  <text x="448" y="671" class="pixel white" font-size="17">04</text>
  <rect x="496" y="649" width="42" height="42" fill="#66563A" shape-rendering="crispEdges"/>
  <rect x="504" y="657" width="26" height="8" fill="#DEBD88"/>
  <rect x="512" y="665" width="10" height="18" fill="#051E39"/>
  <rect x="504" y="683" width="26" height="8" fill="#DEBD88"/>
  <text x="562" y="666" class="pixel-heavy white" font-size="16">OPEN EYE SIGNAL</text>
  <text x="562" y="684" class="pixel muted" font-size="12">JON HOPKINS</text>
  <text x="1018" y="671" class="pixel muted" font-size="13">IMMUNITY</text>
  <text x="1318" y="671" class="pixel gold" font-size="18">[X]</text>
  <path d="M448 699H1372" class="inner-line"/>

  <!-- status and actions -->
  <text x="448" y="731" class="pixel faint" font-size="13">PREVIEW BUFFER: 04 / 45    ORDER: USER EDITABLE</text>
  <polygon points="1008,720 1126,720 1116,762 998,762" fill="#12344F" stroke="#DEBD88" stroke-width="3" shape-rendering="crispEdges"/>
  <text x="1062" y="746" class="pixel-heavy gold" font-size="15" text-anchor="middle">REROLL</text>
  <polygon points="1152,720 1372,720 1362,762 1140,762" fill="#8F713D" stroke="#DEBD88" stroke-width="3" shape-rendering="crispEdges"/>
  <text x="1256" y="746" class="pixel-heavy navy" font-size="15" text-anchor="middle">SUBMIT PLAYLIST</text>
  <rect x="1110" y="707" width="22" height="22" class="marker"/>
  <text x="1121" y="719" class="marker-text" font-size="14">d</text>
  <rect x="1360" y="707" width="22" height="22" class="marker"/>
  <text x="1371" y="719" class="marker-text" font-size="14">e</text>

  <!-- bottom status bar, echoing a cartridge-era game HUD -->
  <rect x="32" y="854" width="1376" height="30" fill="#0E2D4D" shape-rendering="crispEdges"/>
  <path d="M32 854H1408M32 884H1408" stroke="#34546C" stroke-width="2" shape-rendering="crispEdges"/>
  <text x="48" y="875" class="pixel white" font-size="14">dave</text>
  <text x="1130" y="875" class="pixel gold" font-size="14">ADDITION 1</text>
  <text x="1292" y="875" class="pixel muted" font-size="14">LIBRARY READY</text>
</svg>
