openapi: 3.1.0
info:
  title: Spotify Butler API
  version: 1.0.0
  description: Browser-facing, owner-scoped API for cached Spotify views and submitted playlist synchronization.
servers:
  - url: /
security:
  - ButlerSession: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Readiness only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/session:
    get:
      responses:
        '200':
          description: Current session and CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session deleted.
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/session/refresh:
    post:
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Rotated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/playlists:
    get:
      responses:
        '200':
          description: Owner-scoped playlist definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistList'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Created definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistReference'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/playlists/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
    get:
      responses:
        '200':
          description: Playlist definition metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistReference'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '200':
          description: Updated owner-scoped definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistReference'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/playlists/{definitionId}/current:
    get:
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
      responses:
        '200':
          description: Current ID-only playlist view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/playlists/{definitionId}/syncs:
    post:
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Authoritative playlist state after last-write-wins replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/library:
    get:
      responses:
        '200':
          description: Cache status and bounded counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/library/refresh:
    post:
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Completed cache refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/run:
    post:
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Completed transitional cache refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/songs:
    get:
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          x-maxIds: 50
          description: One or more comma-separated Spotify track IDs, maximum 50.
      responses:
        '200':
          description: Typed song enrichment in requested order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Songs'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/songs/{trackId}:
    get:
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One typed song enrichment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    ButlerSession:
      type: apiKey
      in: cookie
      name: butler_session
  parameters:
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Sanitized error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message, requestId, details]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: {type: string}}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready]}
    Session:
      type: object
      required: [userId, csrfToken, expiresAt]
      properties:
        userId: {type: string}
        csrfToken: {type: string}
        expiresAt: {type: string, format: date-time}
    PlaylistReference:
      type: object
      required: [id, name, state, spotifyPlaylistId, trackIds]
      properties:
        id: {type: string}
        name: {type: string}
        state: {type: string, enum: [mapped, unmapped]}
        spotifyPlaylistId: {type: [string, 'null']}
        trackIds: {type: array, items: {type: string}}
    PlaylistList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlaylistReference'}}
    CurrentEnvelope:
      type: object
      required: [current]
      properties:
        current:
          anyOf:
            - {$ref: '#/components/schemas/Current'}
            - {type: 'null'}
    Current:
      type: object
      required: [spotifyPlaylistId, trackIds]
      properties:
        spotifyPlaylistId: {type: string}
        trackIds: {type: array, items: {type: string}}
    Library:
      type: object
      required: [status, ownerId, completedAt, counts]
      properties:
        status: {type: string, enum: [empty, ready, refreshing, stale]}
        ownerId: {type: [string, 'null']}
        completedAt: {type: [string, 'null'], format: date-time}
        counts: {type: object, additionalProperties: {type: integer}}
    Album:
      type: object
      required: [id, name, href, uri, releaseDate]
      properties:
        id: {type: [string, 'null']}
        name: {type: [string, 'null']}
        href: {type: [string, 'null']}
        uri: {type: [string, 'null']}
        releaseDate: {type: [string, 'null']}
    Artist:
      type: object
      required: [id, name, href, uri]
      properties:
        id: {type: [string, 'null']}
        name: {type: [string, 'null']}
        href: {type: [string, 'null']}
        uri: {type: [string, 'null']}
    Song:
      type: object
      required: [id, name, href, uri, album, artists, durationMs, explicit, available]
      properties:
        id: {type: string}
        name: {type: string}
        href: {type: string}
        uri: {type: string}
        album: {$ref: '#/components/schemas/Album'}
        artists: {type: array, items: {$ref: '#/components/schemas/Artist'}}
        durationMs: {type: [integer, 'null']}
        explicit: {type: [boolean, 'null']}
        available: {type: boolean}
    Songs:
      type: object
      required: [items, missingIds]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Song'}}
        missingIds: {type: array, items: {type: string}}
    SyncRequest:
      type: object
      required: [trackIds]
      properties:
        trackIds: {type: array, maxItems: 5000, items: {type: string}}
    CreatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 200}
        trackIds: {type: array, default: [], maxItems: 5000, items: {type: string}}
